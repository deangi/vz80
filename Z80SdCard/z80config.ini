; CP/M profile with bundled application disks mounted.

[system]
title = vZ80 CP/M Apps
; Optional iCOM/disk PROM binary loaded into Z80 RAM before boot.
; Leave blank for built-in SELDSK..WRITE trap stubs only.
prom      = /icom-prom.bin
prom_addr = 0xF000

[console]
terminal = adm3a
boot_text = "dir\r"

[disks]
a    = /altair48k-boot.dsk
b    = /floppy1.dsk
c    = /floppy2.dsk
d    = /wordstar.dsk
boot = a
