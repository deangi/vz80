; vZ80 emulator configuration
; Converted from the donor config.json. Copy this to z80config-NAME.ini
; to create a named variant.

[system]
title = vZ80 CP/M 2.2

[console]
; terminal selects the TFT console escape parser: vt100 or adm3a.
terminal = adm3a
; Escapes: \r \n \t \e \xHH \ooo ^C ^[ ^?
boot_text = ""

[disks]
; The donor JSON named A as altair48k.dsk; this payload's boot image is
; altair48k-boot.dsk.
a    = /altair48k-boot.dsk
b    = /floppy1.dsk
c    = /scalc.dsk
d    = /wordstar.dsk
boot = a
