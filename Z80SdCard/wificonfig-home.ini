; vZ80 network configuration
; Converted from the donor config.json.
; Copy this to wificonfig-NAME.ini to create a named variant.

[wifi]
ssid     = YourSSID
password = YourPassword
hostname = vz80

[ntp]
enabled = true
server  = pool.ntp.org

[telnet]
enabled = true
port    = 23

[ftp]
enabled  = true
port     = 21
user     = vz80
password = vz80
